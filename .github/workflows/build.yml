name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'lmi'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU (ReSukiSU)'
        required: true
        type: boolean
        default: false
      target_os:
        description: 'Target OS (目标系统)'
        required: true
        type: choice
        default: 'both'
        options:
          - aosp
          - miui
          - both

jobs:
  build-kernel:
    name: Build ${{ github.event.inputs.device }} | KSU:${{ github.event.inputs.ksu }} | OS:${{ github.event.inputs.target_os }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3
          
    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-
          ${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxvf Clang-16.0.6-20260807.tar.gz

    - name: Download and Apply non-GKI Patches
      run: |
        PATCH_DIR="/tmp/non-gki-patches"
        mkdir -p "$PATCH_DIR"
        cd "$GITHUB_WORKSPACE"

        curl -L --fail -o "$PATCH_DIR/01.fix_kernel_panic_in_xt_qtaguid.patch" \
          "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/175f62f82e1cb1f84a19f8f4c56ef5d4bb95c800/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch"
        curl -L --fail -o "$PATCH_DIR/02.fix_restore_cgroup_file_prefix_handling.patch" \
          "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/175f62f82e1cb1f84a19f8f4c56ef5d4bb95c800/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch"

        for patch_file in \
          "$PATCH_DIR/01.fix_kernel_panic_in_xt_qtaguid.patch" \
          "$PATCH_DIR/02.fix_restore_cgroup_file_prefix_handling.patch"; do
          if patch -p1 --forward --dry-run < "$patch_file" > /dev/null 2>&1; then
            echo "Applying $(basename "$patch_file")"
            patch -p1 < "$patch_file"
          elif patch -p1 -R --dry-run < "$patch_file" > /dev/null 2>&1; then
            echo "Patch already applied, skipping $(basename "$patch_file")"
          else
            echo "Patch failed and does not appear to be already applied: $(basename "$patch_file")"
            exit 1
          fi
        done

    - name: Run Build Script
      run: |
        chmod +x build_kernel.sh
        
        ARGS="${{ github.event.inputs.device }}"
        
        if [ "${{ github.event.inputs.ksu }}" == "true" ]; then
          ARGS="$ARGS ksu"
        fi
        
        if [ "${{ github.event.inputs.target_os }}" != "both" ]; then
          ARGS="$ARGS ${{ github.event.inputs.target_os }}"
        fi
        
        echo "Executing command: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v7
      with:
        name: APTKernel-${{ github.event.inputs.device }}-${{ github.event.inputs.target_os }}-${{ github.run_id }}
        path: APTKernel_*.zip
        compression-level: 0 # 已经被 zip 压缩过，无需再二次压缩
